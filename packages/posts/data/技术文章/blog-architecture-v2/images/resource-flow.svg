<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="figureTitle figureDesc">
  <title id="figureTitle">文件怎样发布，页面怎样引用</title>
  <desc id="figureDesc">上半部分表示打包与子构建的文件和生成器新产生的文件在生成器汇合，再交回宿主统一输出。下半部分表示发布地址通过全站、单页和模板的引用登记，进入 HTML 和页面配置。实线是文件流，虚线是引用流。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9"><path d="M0 .5L9 4.5L0 8.5Z" fill="#426382"/></marker>
    <marker id="referenceArrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9"><path d="M0 .5L9 4.5L0 8.5Z" fill="#8b5b26"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "Microsoft YaHei UI", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #172c3d; }
      .title { font-size: 38px; font-weight: 700; }
      .section { font-size: 25px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; fill: #43586c; }
      .detail { font-size: 19px; fill: #43586c; }
      .note { font-size: 18px; fill: #375673; }
      .reference-note { font-size: 18px; fill: #71471c; }
      .arrow { fill: none; stroke: #426382; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#arrow); }
      .reference { fill: none; stroke: #8b5b26; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#referenceArrow); }
    </style>
  </defs>
  <rect width="1400" height="800" fill="#f8f9fb"/>
  <text x="48" y="65" class="title" text-anchor="start">文件怎样发布，页面怎样引用</text>
  <text x="48" y="108" class="body" text-anchor="start">文件是否输出，与页面何时使用它，是两件分别管理的事。</text>
  <rect x="48" y="144" width="1304" height="312" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="72" y="182" class="section" text-anchor="start">文件流：收集内容与发布路径</text>
  <rect x="72" y="208" width="344" height="96" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="96" y="246" class="label" text-anchor="start">打包与子构建</text><text x="96" y="284" class="body" text-anchor="start">浏览器脚本、样式等</text>
  <rect x="72" y="336" width="344" height="96" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="96" y="374" class="label" text-anchor="start">生成器内处理资源</text><text x="96" y="412" class="body" text-anchor="start">字体、OG 图片等</text>
  <rect x="610" y="248" width="280" height="138" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="634" y="286" class="label" text-anchor="start">生成器汇合文件</text><text x="634" y="324" class="body" text-anchor="start">前序文件 + 本轮产物</text><text x="634" y="355" class="body" text-anchor="start">包括最终页面 HTML</text>
  <rect x="1050" y="248" width="278" height="138" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="1074" y="286" class="label" text-anchor="start">统一输出静态站点</text><text x="1074" y="324" class="body" text-anchor="start">宿主收集完整结果</text><text x="1074" y="355" class="body" text-anchor="start">由输出插件写入</text>
  <path d="M418 256H510V286H608" class="arrow"/>
  <text x="518" y="238" class="note" text-anchor="start">前序产物</text>
  <path d="M418 384H510V348H608" class="arrow"/>
  <text x="518" y="412" class="note" text-anchor="start">本轮产物</text>
  <path d="M892 316H1048" class="arrow"/>
  <text x="970" y="300" class="note" text-anchor="middle">交回宿主</text>
  <rect x="48" y="490" width="1304" height="236" rx="16" fill="#fff7e9" stroke="#d6b688" stroke-width="2"/>
  <text x="72" y="530" class="section" text-anchor="start">引用流：决定页面怎样使用</text>
  <rect x="72" y="556" width="344" height="136" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="96" y="594" class="label" text-anchor="start">已确定的发布地址</text><text x="96" y="632" class="body" text-anchor="start">脚本 URL、字体 CSS URL</text><text x="96" y="663" class="body" text-anchor="start">也可以只登记按需加载地址</text>
  <rect x="610" y="556" width="280" height="136" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="634" y="594" class="label" text-anchor="start">全站 / 单页 / 模板</text><text x="634" y="632" class="body" text-anchor="start">登记脚本、样式、预加载</text><text x="634" y="663" class="body" text-anchor="start">或合入页面配置</text>
  <rect x="1050" y="556" width="278" height="136" rx="16" fill="#fff" stroke="#c0d0de" stroke-width="2"/><text x="1074" y="594" class="label" text-anchor="start">HTML 与页面配置</text><text x="1074" y="632" class="body" text-anchor="start">生成资源标签</text><text x="1074" y="663" class="body" text-anchor="start">或保存按需加载地址</text>
  <path d="M418 624H608" class="reference"/>
  <text x="514" y="608" class="reference-note" text-anchor="middle">登记用途</text>
  <path d="M892 624H1048" class="reference"/>
  <text x="970" y="608" class="reference-note" text-anchor="middle">渲染时读取</text>
  <text x="48" y="769" class="detail" text-anchor="start">实线表示文件流，虚线表示引用流；生成了文件，并不意味着浏览器立即请求它。</text>
</svg>
