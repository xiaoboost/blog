<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="figureTitle figureDesc">
  <title id="figureTitle">Runner：执行边界与共享上下文</title>
  <desc id="figureDesc">左侧是宿主 Node 进程持有的调度器、注册回调、共享内存、磁盘缓存和构建服务；右侧是本轮 VM 中的生成程序、运行时接口及本轮状态。宿主先执行程序并取得生成器函数，随后调用它。生成器函数仍保留 VM 作用域。初始化时注入对象与回调引用，运行时通过接口访问共享状态和调用宿主方法。页面生成内部的各阶段不在本图展开。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 .5L9 4.5L0 8.5Z" fill="#426382"/>
    </marker>
    <marker id="accessArrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 .5L9 4.5L0 8.5Z" fill="#8b5b26"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Microsoft YaHei UI", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #172c3d; }
      .title { font-size: 38px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; fill: #43586c; }
      .detail { font-size: 18px; fill: #43586c; }
      .note { font-size: 18px; fill: #375673; }
      .access-note { font-size: 19px; fill: #71471c; }
      .tag { font-size: 17px; fill: #527663; }
      .arrow { fill: none; stroke: #426382; stroke-width: 2.5; marker-end: url(#arrow); }
      .access { fill: none; stroke: #8b5b26; stroke-width: 2.5; stroke-dasharray: 7 6; stroke-linejoin: round; marker-end: url(#accessArrow); }
    </style>
  </defs>

  <rect width="1400" height="1000" fill="#f8f9fb"/>
  <text x="48" y="62" class="title">Runner：执行边界与共享上下文</text>
  <text x="48" y="102" class="body">执行发生在本轮 VM 中，状态与服务按生命周期分别持有</text>

  <!-- 两侧表示对象与代码所在的执行环境。 -->
  <rect x="40" y="144" width="464" height="720" rx="22" fill="#eaf3ee" stroke="#b5ccbf" stroke-width="2"/>
  <text x="68" y="184" class="section">宿主</text>
  <text x="150" y="184" class="body">Node 进程</text>

  <rect x="836" y="144" width="524" height="720" rx="22" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="864" y="184" class="section">本轮 VM 上下文</text>
  <rect x="1200" y="160" width="132" height="32" rx="8" fill="#ffffff"/>
  <text x="1266" y="182" text-anchor="middle" class="detail">每轮重新创建</text>

  <!-- 执行程序、取得函数、调用函数：只画跨上下文的交接。 -->
  <rect x="68" y="212" width="408" height="144" rx="14" fill="#ffffff" stroke="#b5ccbf" stroke-width="2"/>
  <text x="92" y="247" class="label">Runner 执行生成程序</text>
  <text x="92" y="291" class="body">保存导出的生成器函数</text>
  <text x="92" y="335" class="body">afterRunner 中调用函数</text>

  <rect x="864" y="212" width="468" height="144" rx="14" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="888" y="247" class="label">模块初始化，登记内部回调</text>
  <text x="888" y="291" class="body">导出的函数保留 VM 作用域</text>
  <text x="888" y="335" class="body">等待 hooks 就绪，执行生成器</text>

  <path d="M477 238H862" class="arrow"/>
  <text x="670" y="225" text-anchor="middle" class="note">① 执行程序</text>
  <path d="M863 282H478" class="arrow"/>
  <text x="670" y="269" text-anchor="middle" class="note">② 取得生成器函数</text>
  <path d="M477 326H862" class="arrow"/>
  <text x="670" y="313" text-anchor="middle" class="note">③ 调用 generate(已有资源)</text>

  <!-- 上下文包含回调与宿主持有对象的引用。 -->
  <rect x="68" y="416" width="408" height="144" rx="14" fill="#ffffff" stroke="#b5ccbf" stroke-width="2"/>
  <text x="92" y="452" class="label">供生成程序使用的上下文</text>
  <text x="92" y="492" class="body">插件注册回调</text>
  <text x="92" y="532" class="body">共享 Map 与 Builder 引用</text>

  <rect x="864" y="416" width="468" height="144" rx="14" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="888" y="452" class="label">@blog/context/runtime</text>
  <text x="888" y="492" class="body">内部 + 宿主回调 → 本轮 hooks</text>
  <text x="888" y="532" class="body">共享内存访问器 · Builder 方法包装</text>

  <path d="M477 478H862" class="arrow"/>
  <text x="670" y="463" text-anchor="middle" class="note">初始化时注入引用与回调</text>

  <!-- 生命周期由归属与标签表达，避免重复画第二轮 VM。 -->
  <rect x="68" y="632" width="408" height="204" rx="14" fill="#fff7e9" stroke="#d6b688" stroke-width="2"/>
  <text x="92" y="670" class="label">宿主持有的服务与缓存</text>
  <text x="92" y="708" class="body">共享 Map</text>
  <rect x="380" y="686" width="72" height="28" rx="7" fill="#eaf3ee"/>
  <text x="416" y="706" text-anchor="middle" class="tag">跨轮</text>
  <text x="92" y="750" class="body">磁盘缓存</text>
  <rect x="360" y="728" width="92" height="28" rx="7" fill="#eaf3ee"/>
  <text x="406" y="748" text-anchor="middle" class="tag">跨进程</text>
  <text x="92" y="790" class="body">Builder 服务</text>
  <text x="92" y="818" class="detail">解析、命名、产物登记、文件监听</text>

  <rect x="864" y="632" width="468" height="204" rx="14" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="888" y="670" class="label">本轮重新建立的状态</text>
  <text x="888" y="710" class="body">运行时 hooks 与模块局部状态</text>
  <text x="888" y="750" class="body">生成器创建的页面对象</text>
  <text x="888" y="792" class="body">重建时重新初始化</text>
  <text x="888" y="820" class="detail">共享引用仍指向宿主保存的对象</text>

  <path d="M863 548H700V704H478" class="access"/>
  <text x="680" y="592" text-anchor="end" class="access-note">读写共享状态</text>
  <text x="680" y="620" text-anchor="end" class="access-note">调用宿主方法</text>

  <rect x="40" y="894" width="1320" height="76" rx="14" fill="#ffffff" stroke="#d5dee7" stroke-width="1.5"/>
  <text x="64" y="926" class="body">实线表示执行与注入，虚线表示运行中的共享访问与方法调用。</text>
  <text x="64" y="954" class="detail">同一 Node 进程内传递对象与函数引用；页面生成内部的各阶段在下一张流程图中展开。</text>
</svg>
