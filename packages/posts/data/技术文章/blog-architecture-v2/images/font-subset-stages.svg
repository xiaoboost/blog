<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="figureTitle figureDesc">
  <title id="figureTitle">FontBlock 的四个生成阶段</title>
  <desc id="figureDesc">以文章中的 FontBlock 为例。数据准备阶段等待本轮字体收集逻辑初始化，并建立页面与生成上下文；预渲染时执行 FontBlock，按页面和字体文件记录组件传入的文字；beforeBuild 读取原始字体，将文字加入页面字体集合，生成 WOFF2 和 CSS，并登记文件与引用；正式渲染时 FontBlock 取得字体类名，Document 输出 CSS 引用及字体预加载。四个阶段通过同一个 Page 关联收集结果和资源。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 .5L9 4.5L0 8.5Z" fill="#426382"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Microsoft YaHei UI", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #172c3d; }
      .title { font-size: 38px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; fill: #43586c; }
      .detail { font-size: 19px; fill: #43586c; }
      .phase { font-size: 19px; fill: #52708a; }
      .result { font-size: 21px; font-weight: 700; fill: #244560; }
      .arrow { fill: none; stroke: #426382; stroke-width: 2.5; marker-end: url(#arrow); }
      .shared { fill: none; stroke: #a5c2b1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#f8f9fb"/>
  <text x="48" y="65" class="title">FontBlock 的四个生成阶段</text>
  <text x="48" y="108" class="body">同一段文字先参与字体收集，再使用已准备好的字体完成正式渲染。</text>

  <!-- 四个阶段等宽，强调输入和输出，不展开字体处理内部细节。 -->
  <rect x="48" y="164" width="296" height="304" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="72" y="205" class="label">1　数据准备</text>
  <text x="72" y="239" class="phase">prepare</text>
  <text x="72" y="283" class="detail">等待本轮收集逻辑就绪</text>
  <text x="72" y="313" class="detail">创建页面与生成上下文</text>
  <rect x="68" y="354" width="256" height="88" rx="12" fill="#fff"/>
  <text x="196" y="389" class="result" text-anchor="middle">本轮环境已就绪</text>
  <text x="196" y="420" class="detail" text-anchor="middle">页面对象 · 字体收集容器</text>

  <rect x="384" y="164" width="296" height="304" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="408" y="205" class="label">2　预渲染</text>
  <text x="408" y="239" class="phase">preRender</text>
  <text x="408" y="283" class="detail">执行 FontBlock 组件</text>
  <text x="408" y="313" class="detail">记录字体路径和组件文字</text>
  <rect x="404" y="354" width="256" height="88" rx="12" fill="#fff"/>
  <text x="532" y="389" class="result" text-anchor="middle">按页面与字体归组</text>
  <text x="532" y="420" class="detail" text-anchor="middle">同页同字体的文字汇合</text>

  <rect x="720" y="164" width="296" height="304" rx="16" fill="#fff7e9" stroke="#d6b688" stroke-width="2"/>
  <text x="744" y="205" class="label">3　处理页面资源</text>
  <text x="744" y="239" class="phase">beforeBuild</text>
  <text x="744" y="283" class="detail">生成 WOFF2 与 CSS</text>
  <text x="744" y="313" class="detail">登记字体文件与页面引用</text>
  <rect x="740" y="354" width="256" height="88" rx="12" fill="#fff"/>
  <text x="868" y="389" class="result" text-anchor="middle">字体资源已就绪</text>
  <text x="868" y="420" class="detail" text-anchor="middle">WOFF2 · CSS · 字体类名</text>

  <rect x="1056" y="164" width="296" height="304" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="1080" y="205" class="label">4　正式渲染</text>
  <text x="1080" y="239" class="phase">render</text>
  <text x="1080" y="283" class="detail">取得字体类名，应用到文字</text>
  <text x="1080" y="313" class="detail">输出 CSS 引用与字体预加载</text>
  <rect x="1076" y="354" width="256" height="88" rx="12" fill="#fff"/>
  <text x="1204" y="389" class="result" text-anchor="middle">最终 HTML</text>
  <text x="1204" y="420" class="detail" text-anchor="middle">已包含完整的字体引用</text>

  <path d="M346 294H382" class="arrow"/>
  <path d="M682 294H718" class="arrow"/>
  <path d="M1018 294H1054" class="arrow"/>

  <!-- 以页面关联组件的收集结果与页面资源，收集记录由 FontBlock 本轮状态持有。 -->
  <path d="M196 470V524M532 470V524M868 470V524M1204 470V524" class="shared"/>
  <rect x="48" y="526" width="1304" height="66" rx="14" fill="#eaf3ee" stroke="#b5ccbf" stroke-width="2"/>
  <text x="700" y="568" class="body" text-anchor="middle">以同一个 Page 关联各阶段：收集字体与文字，生成资源，再读取类名与引用。</text>
</svg>
