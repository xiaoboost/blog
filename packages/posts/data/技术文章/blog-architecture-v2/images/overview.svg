<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1168" viewBox="0 0 1280 1168" role="img" aria-labelledby="figureTitle figureDesc">
  <title id="figureTitle">博客架构总览</title>
  <desc id="figureDesc">主构建打包生成器。Runner 在 Node VM 中执行程序，取出生成器函数，由宿主调用。子构建提供类名、发布路径，并将静态文件交由生成器汇总；生成器依次执行数据准备、预渲染、处理页面资源和正式渲染，最终产物统一组成静态站点，交由浏览器加载。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 0.5L9 4.5L0 8.5Z" fill="#426382"/>
    </marker>
    <marker id="resourceArrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 0.5L9 4.5L0 8.5Z" fill="#8b5b26"/>
    </marker>
    <marker id="phaseArrow" markerWidth="7" markerHeight="7" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 0.5L9 4.5L0 8.5Z" fill="#6686a4"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Microsoft YaHei UI", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #172c3d; }
      .title { font-size: 42px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .label { font-size: 29px; font-weight: 700; }
      .detail { font-size: 22px; fill: #43586c; }
      .note { font-size: 20px; fill: #375673; }
      .phase-label { font-size: 23px; font-weight: 700; fill: #244560; }
      .resource-note { font-size: 20px; fill: #71471c; }
      .arrow { fill: none; stroke: #426382; stroke-width: 3; marker-end: url(#arrow); }
      .resource { fill: none; stroke: #8b5b26; stroke-width: 3; marker-end: url(#resourceArrow); }
      .phase-flow { fill: none; stroke: #6686a4; stroke-width: 2.5; marker-end: url(#phaseArrow); }
    </style>
  </defs>

  <rect width="1280" height="1168" fill="#f8f9fb"/>
  <text x="64" y="66" class="title">博客架构总览</text>

  <rect x="48" y="210" width="1184" height="642" rx="23" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="78" y="250" class="section">构建期 Builder</text>

  <rect x="64" y="102" width="1152" height="76" rx="14" fill="#ffffff" stroke="#c0ccda" stroke-width="2"/>
  <text x="90" y="148" class="label">构建输入</text>
  <text x="254" y="148" class="detail">MDX 文章、模板与组件、样式和脚本</text>

  <rect x="80" y="273" width="580" height="107" rx="15" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="106" y="316" class="label">打包器 Bundler</text>
  <text x="106" y="351" class="detail">编译、解析、加载、代码转换</text>

  <rect x="852" y="273" width="348" height="107" rx="15" fill="#fff7e9" stroke="#d6b688" stroke-width="2"/>
  <text x="878" y="316" class="label">子构建</text>
  <text x="878" y="351" class="detail">构建样式和浏览器脚本</text>

  <rect x="80" y="456" width="580" height="96" rx="15" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="106" y="494" class="label">运行器 Runner</text>
  <text x="106" y="530" class="detail">在 Node VM 中执行程序，取出生成器函数</text>

  <rect x="80" y="619" width="817" height="167" rx="15" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="106" y="666" class="label">生成网站 Generator</text>
  

  <rect x="104" y="701" width="151" height="57" rx="10" fill="#e8f0f8"/>
  <rect x="290" y="701" width="137" height="57" rx="10" fill="#e8f0f8"/>
  <rect x="462" y="701" width="190" height="57" rx="10" fill="#e8f0f8"/>
  <rect x="687" y="701" width="185" height="57" rx="10" fill="#e8f0f8"/>
  <text x="179.5" y="738" text-anchor="middle" class="phase-label">数据准备</text>
  <text x="358.5" y="738" text-anchor="middle" class="phase-label">预渲染</text>
  <text x="557" y="738" text-anchor="middle" class="phase-label">处理页面资源</text>
  <text x="779.5" y="738" text-anchor="middle" class="phase-label">正式渲染</text>
  <path d="M261 729.5H284" class="phase-flow"/>
  <path d="M433 729.5H456" class="phase-flow"/>
  <path d="M658 729.5H681" class="phase-flow"/>

  <rect x="64" y="916" width="1152" height="78" rx="14" fill="#ffffff" stroke="#afc3d8" stroke-width="2"/>
  <text x="90" y="965" class="label">统一输出静态站点</text>
  <text x="406" y="965" class="detail">HTML、CSS、JS、图片、字体和页面配置</text>

  <rect x="64" y="1061" width="1152" height="76" rx="14" fill="#eaf3ee" stroke="#b5ccbf" stroke-width="2"/>
  <text x="90" y="1108" class="label">浏览器</text>
  <text x="231" y="1108" class="detail">显示 HTML、加载页面资源，按需请求额外功能</text>

  <path d="M420 179V272" class="arrow"/>
  <path d="M661 308H850" class="resource"/>
  <text x="756" y="297" text-anchor="middle" class="resource-note">遇到资源入口</text>
  <path d="M850 355H661" class="resource"/>
  <text x="756" y="343" text-anchor="middle" class="resource-note">类名或发布路径</text>

  <path d="M420 381V455" class="arrow"/>
  <text x="443" y="427" class="note">网站生成程序</text>
  <path d="M420 553V618" class="arrow"/>
  <text x="443" y="594" class="note">宿主调用</text>

  <path d="M420 787V915" class="arrow"/>
  <text x="443" y="831" class="note">HTML 与汇总后的静态资源</text>
  <path d="M1026 381V658H899" class="resource"/>
  <text x="1047" y="530" class="resource-note">CSS、JS 等文件</text>

  <path d="M420 995V1059" class="arrow"/>
  <text x="443" y="1034" class="note">部署静态文件</text>
</svg>