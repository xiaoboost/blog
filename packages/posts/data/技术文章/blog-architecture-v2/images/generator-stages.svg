<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="figureTitle figureDesc">
  <title id="figureTitle">生成器的四个阶段与共享上下文</title>
  <desc id="figureDesc">生成器依次完成数据准备、预渲染、处理页面资源和正式渲染。数据准备阶段建立生成器上下文 BuildContext，其中包含站点 Site、页面集合 Page[]，以及资源命名和日志等公共操作。后续阶段使用同一份上下文，收集信息、登记资源并生成最终 HTML，最后汇总产物并交回宿主统一输出。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8.6" refY="4.5" orient="auto" viewBox="0 0 10 9">
      <path d="M0 .5L9 4.5L0 8.5Z" fill="#426382"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Microsoft YaHei UI", "Noto Sans CJK SC", "SimHei", sans-serif; fill: #172c3d; }
      .title { font-size: 38px; font-weight: 700; }
      .section { font-size: 27px; font-weight: 700; }
      .label { font-size: 24px; font-weight: 700; }
      .body { font-size: 21px; fill: #43586c; }
      .detail { font-size: 20px; fill: #43586c; }
      .phase-name { font-size: 20px; fill: #52708a; }
      .arrow { fill: none; stroke: #426382; stroke-width: 2.5; marker-end: url(#arrow); }
      .context-link { fill: none; stroke: #a5c2b1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1400" height="720" fill="#f8f9fb"/>
  <text x="48" y="65" class="title">生成器的四个阶段</text>
  <text x="48" y="108" class="body">先收集信息，再处理资源，最后使用准备好的数据与引用生成页面。</text>

  <!-- 阶段描述只表达生成器职责，具体业务由正文说明。 -->
  <rect x="48" y="166" width="296" height="174" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="72" y="205" class="label">1　数据准备</text>
  <text x="72" y="240" class="phase-name">prepare</text>
  <text x="72" y="279" class="detail">创建站点与页面对象</text>
  <text x="72" y="310" class="detail">建立生成器上下文</text>

  <rect x="384" y="166" width="296" height="174" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="408" y="205" class="label">2　预渲染</text>
  <text x="408" y="240" class="phase-name">preRender</text>
  <text x="408" y="279" class="detail">执行页面组件</text>
  <text x="408" y="310" class="detail">收集后续处理所需的信息</text>

  <rect x="720" y="166" width="296" height="174" rx="16" fill="#fff7e9" stroke="#d6b688" stroke-width="2"/>
  <text x="744" y="205" class="label">3　处理页面资源</text>
  <text x="744" y="240" class="phase-name">beforeBuild</text>
  <text x="744" y="279" class="detail">根据已有信息处理资源</text>
  <text x="744" y="310" class="detail">登记文件、引用与配置</text>

  <rect x="1056" y="166" width="296" height="174" rx="16" fill="#edf3f9" stroke="#c0d0de" stroke-width="2"/>
  <text x="1080" y="205" class="label">4　正式渲染</text>
  <text x="1080" y="240" class="phase-name">render</text>
  <text x="1080" y="279" class="detail">使用准备好的资源与配置</text>
  <text x="1080" y="310" class="detail">生成最终 HTML</text>

  <path d="M346 253H382" class="arrow"/>
  <path d="M682 253H718" class="arrow"/>
  <path d="M1018 253H1054" class="arrow"/>

  <!-- 纵向连线表达各阶段与同一份上下文的关系。 -->
  <path d="M196 342V402" class="context-link"/>
  <path d="M532 342V402" class="context-link"/>
  <path d="M868 342V402" class="context-link"/>
  <path d="M1204 342V402" class="context-link"/>

  <rect x="48" y="404" width="1304" height="212" rx="16" fill="#eaf3ee" stroke="#b5ccbf" stroke-width="2"/>
  <text x="700" y="447" class="section" text-anchor="middle">生成器上下文 BuildContext</text>
  <text x="700" y="479" class="detail" text-anchor="middle">在数据准备阶段建立，由后续阶段共同使用</text>

  <path d="M460 502V586M940 502V586" class="context-link"/>
  <text x="254" y="535" class="label" text-anchor="middle">站点 Site</text>
  <text x="254" y="571" class="detail" text-anchor="middle">全站数据与资源登记</text>

  <text x="700" y="535" class="label" text-anchor="middle">页面集合 Page[]</text>
  <text x="700" y="571" class="detail" text-anchor="middle">页面数据、资源登记与渲染入口</text>

  <text x="1146" y="535" class="label" text-anchor="middle">公共操作</text>
  <text x="1146" y="571" class="detail" text-anchor="middle">资源命名 · 日志输出</text>

  <rect x="48" y="644" width="1304" height="48" rx="10" fill="#fff" stroke="#d5dee7" stroke-width="2"/>
  <text x="700" y="676" class="detail" text-anchor="middle">产物收尾：汇总 HTML 与资源，交回宿主统一输出</text>
</svg>
